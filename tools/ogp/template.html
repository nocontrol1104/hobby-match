<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OGP 画像テンプレート</title>
<!--
  シェア用画像（1200×630）のテンプレート。tools/build_ogp.py がブラウザで開いてスクリーンショットを撮る。
  ?key=LLL のようにタイプのキーを付けるとタイプ別、付けないとサイト共通の画像になる。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
  :root {
    --bg: #EEF2F7; --surface: #FFFFFF; --ink: #1B2238; --muted: #5D6680;
    --accent: #4B3FE0; --accent-soft: #E6E3FF; --mint: #12A37C; --sun: #F2A516;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .frame {
    width: 1120px; height: 550px; background: var(--surface); border-radius: 40px;
    padding: 56px 72px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .frame::after {
    content: ""; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%;
    background: conic-gradient(var(--accent) 0 33%, var(--mint) 0 66%, var(--sun) 0); opacity: .12;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 34px; }
  .dot { width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(var(--accent) 0 33%, var(--mint) 0 66%, var(--sun) 0); }
  .main { display: flex; align-items: center; gap: 48px; }
  .main > div:last-child { min-width: 0; flex: 1; }
  .animal { font-size: 200px; line-height: 1; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  .eyebrow { font-size: 30px; color: var(--muted); font-weight: 700; }
  .name { white-space: nowrap; font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 72px; line-height: 1.2; color: var(--accent); margin: 6px 0 10px; }
  .tagline { font-size: 32px; font-weight: 700; }
  .cta { font-size: 28px; color: var(--muted); font-weight: 700; }
  .cta b { color: var(--ink); }
  /* サイト共通 */
  .home h1 { white-space: nowrap; font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 68px; line-height: 1.3; }
  .home h1 em { font-style: normal; color: var(--accent); }
  .zoo { font-size: 64px; letter-spacing: 8px; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script src="../../site/data.js"></script>
<script>
  (function () {
    var D = window.SHUMI_DATA;
    var key = new URLSearchParams(location.search).get("key");
    var t = key && D.types[key];
    var brand = '<div class="brand"><span class="dot"></span>シュミのたね</div>';
    var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
    var frame = document.getElementById("frame");
    if (t) {
      frame.innerHTML = brand +
        '<div class="main"><div class="animal">' + t.animal + '</div><div>' +
        '<p class="eyebrow">わたしの趣味タイプは</p>' +
        '<p class="name">' + esc(t.name) + '</p>' +
        '<p class="tagline">' + esc(t.tagline) + '</p></div></div>' +
        '<p class="cta"><b>14の質問</b>で、あなたに合う趣味が見つかる無料診断</p>';
    } else {
      var zoo = Object.keys(D.types).map(function (k) { return D.types[k].animal; }).join("");
      frame.className = "frame home";
      frame.innerHTML = brand +
        '<h1>14の質問で、<br><em>あなたに合う趣味</em>が見つかる。</h1>' +
        '<div class="zoo">' + zoo + '</div>' +
        '<p class="cta">8種類の動物タイプで診断する、無料の趣味診断</p>';
    }
    // 長いタイプ名は1行に収まるまで文字を小さくする
    document.fonts.ready.then(function () {
      var n = frame.querySelector(".name");
      if (n) { var size = 72; while (n.scrollWidth > n.clientWidth && size > 40) { size -= 2; n.style.fontSize = size + "px"; } }
      document.body.setAttribute("data-ready", "1");
    });
  })();
</script>
</body>
</html>
