# site/ を GitHub Pages に公開するワークフロー。
# 今は手動実行（Actions タブの「Run workflow」）のときだけ動く。
# 公開を始めたら、main への push でも自動公開するよう下の push のコメントを外す。
name: GitHub Pages に公開

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["site/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
